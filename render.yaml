# Render Blueprint: https://render.com/docs/blueprint-spec
# Connect this repo on Render, or configure an existing web service manually:
#   Build command:  pip install -r requirements.txt
#   Start command:  uvicorn server:app --host 0.0.0.0 --port $PORT
services:
  - type: web
    name: reporag
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      # Comma-separated list of frontend origins allowed to call the API.
      # Set this to your Vercel domain, e.g. https://repo-rag.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      # Optional: point Chroma/SQLite at a mounted disk so data survives deploys.
      - key: DATA_DIR
        sync: false
